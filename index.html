<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ほっとニュース｜今日の、いいニュース。</title>
<meta name="description" content="心が温まるニュース、希望が持てるニュース、くすっと笑えるニュース。日本と世界から、毎朝お届けします。心体調整塾のコンテンツサイトです。">
<style>
  :root{
    --ink:#4a342a; --sub:#8a766b; --line:#eee3da;
    --warm:#fdf6ef; --card:#ffffff;
    --accent:#e8862e; --accent2:#4a90b8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    color:var(--ink); background:var(--warm);
    line-height:1.8; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:680px;margin:0 auto;padding:0 18px 48px;}
  header{text-align:center;padding:42px 0 8px;}
  .site-name{font-size:15px;letter-spacing:.35em;color:var(--accent);font-weight:700;}
  h1{font-size:34px;font-weight:800;margin:6px 0 2px;}
  .tagline{color:var(--sub);font-size:15px;}
  .date{margin-top:14px;display:inline-block;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:4px 18px;font-size:14px;color:var(--sub);}
  .intro{text-align:center;color:var(--sub);font-size:14.5px;margin:20px 6px 6px;}
  section{margin-top:38px;}
  .cat-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .cat-head .icon{font-size:24px;}
  .cat-head h2{font-size:21px;font-weight:800;}
  .cat-head .rule{flex:1;height:1px;background:var(--line);}
  article{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px 20px 16px;margin-bottom:14px;
    box-shadow:0 2px 10px rgba(120,80,40,.05);
  }
  .area{display:inline-block;font-size:12px;font-weight:700;color:#fff;
    background:var(--accent2);border-radius:999px;padding:1px 10px;margin-bottom:8px;}
  .area.jp{background:var(--accent);}
  article h3{font-size:18.5px;font-weight:800;line-height:1.5;margin-bottom:8px;}
  article p{font-size:15px;color:#5d493f;}
  .more{margin-top:10px;font-size:13.5px;}
  .more a{color:var(--accent2);text-decoration:none;font-weight:700;}
  .more a:hover{text-decoration:underline;}
  .src{color:var(--sub);font-weight:400;}
  .archive{margin-top:44px;}
  .archive h2{font-size:17px;margin-bottom:10px;}
  .archive li{list-style:none;font-size:14px;color:var(--sub);padding:6px 0;border-bottom:1px dashed var(--line);}
  footer{margin-top:52px;text-align:center;color:var(--sub);font-size:13px;line-height:1.9;}
  footer .brand{font-weight:700;color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="site-name">ホッ ト ニ ュ ー ス</div>
    <h1>今日の、いいニュース。</h1>
    <p class="tagline">心が温まる話、希望が持てる話、くすっと笑える話を、少しずつ。</p>
    <div><span class="date" id="dateLabel"></span></div>
  </header>

  <p class="intro">日本と世界から集めた、ほっとするニュースです。<br>毎朝、更新しています。</p>

  <main id="newsMain"></main>

  <div class="archive" id="archiveBox" style="display:none">
    <h2>これまでのニュース</h2>
    <ul id="archiveList"></ul>
  </div>

  <footer>
    <p class="brand">心体調整塾 たけちゃん</p>
    <p>このサイトは、心体調整塾のコンテンツサイトの一つです。<br>
    ニュースの著作権は各配信元にあります。紹介文は要約です。</p>
  </footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.NEWS_DATA;
  document.getElementById('dateLabel').textContent = D.dateLabel + 'のニュース';
  var main = document.getElementById('newsMain');
  D.categories.forEach(function(cat){
    var sec = document.createElement('section');
    var head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = '<span class="icon"></span><h2></h2><span class="rule"></span>';
    head.querySelector('.icon').textContent = cat.icon;
    head.querySelector('h2').textContent = cat.name;
    sec.appendChild(head);
    cat.items.forEach(function(it){
      var a = document.createElement('article');
      var area = document.createElement('span');
      area.className = 'area' + (it.area === '日本' ? ' jp' : '');
      area.textContent = it.area;
      var h = document.createElement('h3'); h.textContent = it.title;
      var p = document.createElement('p'); p.textContent = it.body;
      var more = document.createElement('div'); more.className = 'more';
      var link = document.createElement('a');
      link.href = it.url; link.target = '_blank'; link.rel = 'noopener';
      link.textContent = '元の記事を読む →';
      var src = document.createElement('span'); src.className = 'src';
      src.textContent = '（' + it.source + '）';
      more.appendChild(link); more.appendChild(src);
      a.appendChild(area); a.appendChild(h); a.appendChild(p); a.appendChild(more);
      sec.appendChild(a);
    });
    main.appendChild(sec);
  });
  if (D.archive && D.archive.length){
    var box = document.getElementById('archiveBox');
    var ul = document.getElementById('archiveList');
    D.archive.forEach(function(day){
      var li = document.createElement('li');
      li.textContent = day.dateLabel + '：' + day.titles.join('／');
      ul.appendChild(li);
    });
    box.style.display = 'block';
  }
})();
</script>
</body>
</html>
